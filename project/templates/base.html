<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flaskr</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  </head>
  <body class="bg-light">
    <main class="container py-4">
      <h1><a class="text-decoration-none" href="{{ url_for('index') }}">Flaskr</a></h1>
      <nav class="my-3">
        <a class="btn btn-info" href="{{ url_for('search') }}">Search</a>
        {% if session.get('logged_in') %}
        <a class="btn btn-warning" href="{{ url_for('logout') }}">log out</a>
        {% else %}
        <a class="btn btn-success" href="{{ url_for('login') }}">log in</a>
        {% endif %}
      </nav>
      {% for message in get_flashed_messages() %}
      <p class="flash alert alert-success" role="status">{{ message }}</p>
      {% endfor %}
      {% block body %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='main.js') }}" defer></script>
  </body>
</html>
