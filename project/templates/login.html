{% extends 'base.html' %}
{% block body %}
<h2>Login</h2>
{% if error %}
<p class="error alert alert-danger" role="alert"><strong>Error:</strong> {{ error }}</p>
{% endif %}
<form class="card card-body col-md-6 col-lg-4" action="{{ url_for('login') }}" method="post">
  <p><label class="form-label d-block">Username: <input class="form-control" name="username" autocomplete="username" required></label></p>
  <p><label class="form-label d-block">Password: <input class="form-control" type="password" name="password" autocomplete="current-password" required></label></p>
  <button class="btn btn-primary align-self-start" type="submit">Login</button>
</form>
{% endblock %}
